services:
  # ── Next.js frontend (port 3000) ────────────────────────────────
  front-next:
    build:
      context: ./frontend-next
    ports:
      - "8095:3000"
    environment:
      - BACKEND_URL=http://back:8000
    depends_on:
      back:
        condition: service_healthy
  # ── FastAPI backend (port 8000) ─────────────────────────────────
  back:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    # Docker Model Runner injects LLM_URL and LLM_MODEL automatically
    models:
      - llm
    environment:
      - PROJECT_ID=serial-techos
      - DATA_PROJECT_ID=bigquery-public-data
      - DATASET_ID=google_cloud_release_notes
      - TABLE_ID=release_notes
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
# ── Docker Model Runner ─────────────────────────────────────────
models:
  llm:
    model: ai/gemma4:e4b
    context_size: 32768
    x-google-cloudrun:
      environment:
        PORT: 12434
        MODEL_RUNNER_PORT: 12434
      run-model:
        # :latest is the CPU-only build — on a GPU instance llama.cpp logs
        # "no usable GPU found" and runs on CPU. Use the CUDA build, pinned.
        # inference-container: docker/model-runner:v1.2.8-cuda
        inference-container: docker/model-runner:latest
